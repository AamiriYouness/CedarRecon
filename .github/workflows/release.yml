name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  validate:
    name: Validate Release Tag
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate tag matches csproj version
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"

          CSPROJ_VERSION=$(grep -oP '(?<=<Version>)[^<]+' \
            src/CedarRecon.Application/CedarRecon.Application.csproj \
            || echo "NOT_FOUND")

          echo "Tag version:    $VERSION"
          echo "csproj version: $CSPROJ_VERSION"

          if [ "$VERSION" != "$CSPROJ_VERSION" ]; then
            echo "❌ Tag ($VERSION) does not match csproj ($CSPROJ_VERSION)"
            exit 1
          fi
          echo "✅ Versions match."

  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore

      - name: Build Release
        run: dotnet build --no-restore --configuration Release

      - name: Unit tests
        run: |
          dotnet test tests/CedarRecon.Tests.Unit \
            --no-restore --configuration Release

      - name: Equivalence tests
        run: |
          dotnet test tests/CedarRecon.Tests.Unit \
            --no-restore --configuration Release \
            --filter "ExceptionClassifierEquivalenceTests"

      - name: Integration tests
        run: |
          dotnet test tests/CedarRecon.Tests.Integration \
            --no-restore --configuration Release

  publish:
    name: Build Release Artifacts
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore

      - name: Publish
        run: |
          dotnet publish src/CedarRecon.Application/CedarRecon.Application.csproj \
            --no-restore \
            --configuration Release \
            --output ./publish \
            --self-contained false

      - name: Zip artifacts
        run: |
          cd publish
          zip -r ../CedarRecon-${{ github.ref_name }}.zip .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: CedarRecon-${{ github.ref_name }}.zip
          retention-days: 30

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: publish

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: ./artifacts

      - name: Generate changelog
        run: |
          PREV_TAG=$(git tag --sort=-version:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sed -n '2p')
          CURRENT_TAG="${{ github.ref_name }}"

          if [ -z "$PREV_TAG" ]; then
            LOG=$(git log --pretty=format:"- %s (%h)")
          else
            LOG=$(git log --pretty=format:"- %s (%h)" ${PREV_TAG}..HEAD)
          fi

          cat > CHANGELOG_RELEASE.md << MD
          ## What's Changed

          ${LOG}

          **Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${{ github.ref_name }}
          MD

      - name: Determine pre-release
        id: prerelease
        run: |
          if [[ "${{ github.ref_name }}" == *"-"* ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const changelog = fs.readFileSync('CHANGELOG_RELEASE.md', 'utf8');
            const zip = fs.readFileSync('./artifacts/CedarRecon-${{ github.ref_name }}.zip');

            const release = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: '${{ github.ref_name }}',
              name: 'CedarRecon ${{ github.ref_name }}',
              body: changelog,
              draft: false,
              prerelease: ${{ steps.prerelease.outputs.is_prerelease }}
            });

            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.data.id,
              name: 'CedarRecon-${{ github.ref_name }}.zip',
              data: zip
            });

            console.log(`✅ Release created: ${release.data.html_url}`);
